<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in - Ares</title>
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-page">
    <main class="panel login-panel">
      <div class="login-brand">Ares</div>
      <h1>Sign in</h1>
      <form id="login-form">
        <label class="field">
          <span>Password</span>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="1024" autofocus />
        </label>
        <button id="login-btn" class="btn btn-primary" type="submit">Sign in</button>
        <p id="login-status" class="small" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
